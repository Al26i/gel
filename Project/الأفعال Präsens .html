// إجمالي عدد الأفعال


const container = document.getElementById("verbsContainer");

verbs.forEach(verb => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="title">
      <span class="infinitiv speakable">${verb.infinitiv}</span>
      <span class="arabic">${verb.arabic}</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>ich</th>
          <th>du</th>
          <th>er/sie/es</th>
          <th>wir</th>
          <th>ihr</th>
          <th>sie/Sie</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="speakable">${verb.forms.ich}</td>
          <td class="speakable">${verb.forms.du}</td>
          <td class="speakable">${verb.forms.er}</td>
          <td class="speakable">${verb.forms.wir}</td>
          <td class="speakable">${verb.forms.ihr}</td>
          <td class="speakable">${verb.forms.sie}</td>
        </tr>
      </tbody>
    </table>
  `;
  container.appendChild(card);
});

// --- إضافة منطق الضغط المطول والنطق الذكي ---

// دالة لنطق النص باللغة الألمانية
function speakGerman(text) {
  // إلغاء أي نطق مستمر حالياً لمنع التداخل
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE'; // تعيين اللغة الألمانية
  utterance.rate = 0.85;    // إبطاء السرعة قليلاً بوضوح لتسهيل التعلم
  window.speechSynthesis.speak(utterance);
}

let pressTimer;

// دالة بدء التوقيت للضغط المطول
function startPress(e) {
  const textToSpeak = e.target.innerText;
  
  // تحديد مدة الضغط المطول (500 مللي ثانية = نصف ثانية)
  pressTimer = setTimeout(() => {
    speakGerman(textToSpeak);
  }, 500);
}

// دالة إلغاء التوقيت إذا رفع المستخدم إصبعه أو الماوس مبكراً
function cancelPress() {
  clearTimeout(pressTimer);
}

// تطبيق الأحداث على جميع العناصر التي تحتوي على كلاس "speakable"
document.querySelectorAll('.speakable').forEach(element => {
  // للكمبيوتر (الماوس)
  element.addEventListener('mousedown', startPress);
  element.addEventListener('mouseup', cancelPress);
  element.addEventListener('mouseleave', cancelPress);

  // للهواتف والشاشات اللمسية
  element.addEventListener('touchstart', startPress);
  element.addEventListener('touchend', cancelPress);
  element.addEventListener('touchmove', cancelPress);
});
</script>
