  { section: "part4", infinitiv: "sterben", arabic: "يموت", forms: { ich: "sterbe", du: "stirbst", er: "stirbt", wir: "sterben", ihr: "sterbt", sie: "sterben" } },
  { section: "part4", infinitiv: "vergessen", arabic: "ينسى", forms: { ich: "vergesse", du: "vergisst", er: "vergisst", wir: "vergessen", ihr: "vergesst", sie: "vergessen" } },

  // أفعال قوية يتغير فيها الحرف الصوتي (E -> IE)
  { section: "part4", infinitiv: "sehen", arabic: "يرى", forms: { ich: "sehe", du: "siehst", er: "sieht", wir: "sehen", ihr: "seht", sie: "sehen" } },
  { section: "part4", infinitiv: "lesen", arabic: "يقرأ", forms: { ich: "lese", du: "liest", er: "liest", wir: "lesen", ihr: "lest", sie: "lesen" } },
  { section: "part4", infinitiv: "empfehlen", arabic: "يوصي / ينصح بـ", forms: { ich: "empfehle", du: "empfiehlst", er: "empfiehlt", wir: "empfehlen", ihr: "empfehlt", sie: "empfehlen" } },
  { section: "part4", infinitiv: "stehlen", arabic: "يسرق", forms: { ich: "stehle", du: "stiehlst", er: "stiehlt", wir: "stehlen", ihr: "stehlt", sie: "stehlen" } },

  // أفعال الكيف المساعدة (Modalverben) التي يتغير تصريفها تماماً في المفرد
  { section: "part4", infinitiv: "können", arabic: "يستطيع", forms: { ich: "kann", du: "kannst", er: "kann", wir: "können", ihr: "könnt", sie: "können" } },
  { section: "part4", infinitiv: "müssen", arabic: "يجب", forms: { ich: "muss", du: "musst", er: "muss", wir: "müssen", ihr: "müsst", sie: "müssen" } },
  { section: "part4", infinitiv: "wollen", arabic: "يريد", forms: { ich: "will", du: "willst", er: "will", wir: "wollen", ihr: "wollt", sie: "wollen" } },
  { section: "part4", infinitiv: "dürfen", arabic: "يسمح له", forms: { ich: "darf", du: "darfst", er: "darf", wir: "dürfen", ihr: "dürft", sie: "dürfen" } },
  { section: "part4", infinitiv: "sollen", arabic: "ينبغي", forms: { ich: "soll", du: "sollst", er: "soll", wir: "sollen", ihr: "sollt", sie: "sollen" } },
  { section: "part4", infinitiv: "wissen", arabic: "يعلم / يعرف", forms: { ich: "weiß", du: "weißt", er: "weiß", wir: "wissen", ihr: "wisst", sie: "wissen" } }
];
const container = document.getElementById('verbsContainer');
let currentSection = "";

// دالة لتوليد عناصر واجهة المستخدم ديناميكياً بناءً على البيانات
allVerbs.forEach(verb => {
  // إضافة عنوان القسم إذا تغير القسم الحالي
  if (verb.sectionTitle && currentSection !== verb.section) {
    currentSection = verb.section;
    const secHeader = document.createElement('h2');
    secHeader.id = verb.section;
    secHeader.style.width = '100%';
    secHeader.style.textAlign = 'center';
    secHeader.style.color = '#0077cc';
    secHeader.style.marginTop = '40px';
    secHeader.style.borderBottom = '2px solid #0077cc';
    secHeader.style.paddingBottom = '10px';
    secHeader.innerText = verb.sectionTitle;
    container.appendChild(secHeader);
  }

  // إنشاء الكارت الخاص بكل فعل
  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="title">
      <span class="infinitiv" onclick="speak('${verb.infinitiv}')">${verb.infinitiv}</span>
      <span class="arabic">${verb.arabic}</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>ich</th>
          <th>du</th>
          <th>er/sie/es</th>
          <th>wir</th>
          <th>ihr</th>
          <th>sie/Sie</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td onclick="speak('${verb.forms.ich}')">${verb.forms.ich}</td>
          <td onclick="speak('${verb.forms.du}')">${verb.forms.du}</td>
          <td onclick="speak('${verb.forms.er}')">${verb.forms.er}</td>
          <td onclick="speak('${verb.forms.wir}')">${verb.forms.wir}</td>
          <td onclick="speak('${verb.forms.ihr}')">${verb.forms.ihr}</td>
          <td onclick="speak('${verb.forms.sie}')">${verb.forms.sie}</td>
        </tr>
      </tbody>
    </table>
  `;
  container.appendChild(card);
});

// دالة نطق الكلمات بالألمانية باستخدام ميزة توليد الأصوات في المتصفح Web Speech API
function speak(text) {
  if ('speechSynthesis' in window) {
    // إلغاء أي نطق مستمر لمنع التداخل
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'de-DE'; // تحديد اللغة الألمانية
    utterance.rate = 0.85;    // إبطاء السرعة قليلاً لتسهيل الاستماع والتعلم
    window.speechSynthesis.speak(utterance);
  } else {
    alert("عذراً، متصفحك لا يدعم ميزة النطق الصوتي التلقائي.");
  }
}
</script>
