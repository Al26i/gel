      text-align: center;

    /* الحاوية الرئيسية للبطاقات */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* تصميم البطاقة الذكي */
    .card {
      background: white;
      width: 100%;
      max-width: 850px; 
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      border: 1px solid #eef2f5;
    }

    /* رأس البطاقة (الأزرق) */
    .title {
      background: #0077cc;
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    /* جعل الفعل الرئيسي قابل للنطق أيضاً عند الضغط المطول */
    .infinitiv {
      cursor: pointer;
      user-select: none;
    }

    .arabic {
      font-size: 18px;
      font-weight: normal;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      direction: rtl;
    }

    /* تنسيق الجدول الجديد (أفقي) */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; 
    }

    /* تنسيق صف الضمائر العلوي */
    th {
      background: #fafafa;
      color: #555;
      font-weight: bold;
      font-size: 15px;
      padding: 12px 5px;
      border-bottom: 2px solid #edeff1;
    }

    /* تنسيق صف التصريفات السفلي */
    td {
      text-align: center;
      padding: 15px 5px;
      font-size: 17px;
      color: #2c3e50;
      font-weight: 600;
      cursor: pointer;

    td:hover {

    }

verbs.forEach(verb => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="title">

      <thead>
        <tr>

        </tr>
      </thead>

// --- إضافة منطق الضغط المطول والنطق الذكي ---

// دالة لنطق النص باللغة الألمانية
function speakGerman(text) {
  // إلغاء أي نطق مستمر حالياً لمنع التداخل
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE'; // تعيين اللغة الألمانية
  utterance.rate = 0.85;    // إبطاء السرعة قليلاً بوضوح لتسهيل التعلم
  window.speechSynthesis.speak(utterance);
}

let pressTimer;

// دالة بدء التوقيت للضغط المطول
function startPress(e) {
  const textToSpeak = e.target.innerText;
  
  // تحديد مدة الضغط المطول (500 مللي ثانية = نصف ثانية)
  pressTimer = setTimeout(() => {
    speakGerman(textToSpeak);
  }, 500);
}

// دالة إلغاء التوقيت إذا رفع المستخدم إصبعه أو الماوس مبكراً
function cancelPress() {
  clearTimeout(pressTimer);
}

// تطبيق الأحداث على جميع العناصر التي تحتوي على كلاس "speakable"
document.querySelectorAll('.speakable').forEach(element => {
  // للكمبيوتر (الماوس)
  element.addEventListener('mousedown', startPress);
  element.addEventListener('mouseup', cancelPress);
  element.addEventListener('mouseleave', cancelPress);

  // للهواتف والشاشات اللمسية
  element.addEventListener('touchstart', startPress);
  element.addEventListener('touchend', cancelPress);
  element.addEventListener('touchmove', cancelPress);
});
</script>
