<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Präsens Verben - نظام متطور لتعلم الأفعال الألمانية</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }

    /* الوضع الليلي */
    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
    }

    body.dark-mode .card {
      background: #2d2d44;
      color: #eee;
      border-color: #444;
    }

    body.dark-mode .title {
      background: #1a1a2e;
    }

    body.dark-mode td:hover {
      background: #3d3d5c;
    }

    body.dark-mode .control-bar,
    body.dark-mode .search-box input,
    body.dark-mode .filter-select select {
      background: #2d2d44;
      color: #eee;
      border-color: #555;
    }

    body.dark-mode th {
      background: #3d3d5c;
      color: #ddd;
    }

    body.dark-mode td {
      border-bottom-color: #444;
    }

    body.dark-mode .speed-control {
      background: #3d3d5c;
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* شريط التحكم العلوي */
    .control-bar {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* أزرار التحكم */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
      background: #667eea;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .btn-danger {
      background: #e74c3c;
    }

    .btn-success {
      background: #27ae60;
    }

    .btn-warning {
      background: #f39c12;
    }

    /* مربع البحث والفلاتر */
    .search-section {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 12px 20px;
      width: 300px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .filter-select select {
      padding: 12px 20px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 16px;
      background: white;
      cursor: pointer;
    }

    /* الإحصائيات */
    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 15px 25px;
      border-radius: 15px;
      text-align: center;
      min-width: 120px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 5px;
    }

    /* بطاقة التحدي */
    .challenge-card {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .challenge-card:hover {
      transform: scale(1.02);
    }

    /* تنسيق البطاقات */
    .card {
      background: white;
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: all 0.3s;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      background: #0077cc;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      cursor: pointer;
    }

    /* ألوان مميزة لكل قسم */
    .card[data-section="part1"] .title { background: #3498db; }
    .card[data-section="part2"] .title { background: #27ae60; }
    .card[data-section="part3"] .title { background: #e74c3c; }
    .card[data-section="part4"] .title { background: #f39c12; }
    .card[data-section="part5"] .title { background: #9b59b6; }

    .infinitiv {
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .play-all-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .play-all-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    .arabic {
      background: rgba(255,255,255,0.2);
      padding: 5px 15px;
      border-radius: 20px;
      direction: rtl;
      font-size: 16px;
    }

    .studied-badge {
      background: #27ae60;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 12px 5px;
      background: #f8f9fa;
      color: #555;
      font-size: 14px;
    }

    td {
      text-align: center;
      padding: 15px 5px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #eee;
    }

    td:hover {
      background: #e3f2fd;
    }

    /* سرعة النطق */
    .speed-control {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f0f0f0;
      padding: 5px 15px;
      border-radius: 25px;
    }

    .speed-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: #ddd;
      transition: all 0.3s;
    }

    .speed-btn.active {
      background: #667eea;
      color: white;
    }

    /* وضع التحدي المصغر */
    .mini-challenge {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    body.dark-mode .mini-challenge {
      background: #2d2d44;
    }

    .challenge-question {
      font-size: 24px;
      margin: 15px 0;
    }

    .challenge-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .challenge-option {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .challenge-option:hover {
      background: #764ba2;
      transform: scale(1.05);
    }

    .challenge-feedback {
      margin-top: 15px;
      font-size: 18px;
    }

    /* روابط التنقل بين الأقسام */
    .section-nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .section-nav a {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .section-nav a:hover {
      background: white;
      color: #0077cc;
    }

    /* زر الوضع الليلي */
    .dark-mode-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 24px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s;
      z-index: 1000;
    }

    .dark-mode-toggle:hover {
      transform: scale(1.1);
    }

    /* متجاوب */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      
      th {
        display: none;
      }
      
      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
      
      td::before {
        content: attr(data-label);
        font-weight: bold;
        width: 100px;
      }
      
      .card {
        min-width: auto;
      }
    }
  </style>
</head>

<body>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

  <div class="container">
    <h1 style="text-align: center; color: white; margin-bottom: 10px;">📚 تصريف الأفعال الألمانية - Präsens</h1>
    <p style="text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 30px;">🎯 اضغط على أي كلمة لسماع النطق | 🌟 تحدى نفسك في وضع الاختبار</p>

    <div class="control-bar">
      <div class="controls">
        <a href="../index.html" class="btn">Home 🔙</a>
        <button class="btn" onclick="resetProgress()">🔄 إعادة تعيين التقدم</button>
        <button class="btn btn-success" onclick="showRandomChallenge()">🎯 تحدٍ عشوائي</button>
        <div class="speed-control">
          <span>⚡ سرعة النطق:</span>
          <button class="speed-btn" onclick="setSpeechSpeed(0.6)">بطيء</button>
          <button class="speed-btn active" onclick="setSpeechSpeed(0.85)">عادي</button>
          <button class="speed-btn" onclick="setSpeechSpeed(1.1)">سريع</button>
        </div>
      </div>

      <div class="search-section">
        <div class="search-box">

        <div class="filter-select">
          <select id="filterSelect" onchange="filterVerbs()">

            <option value="part2">🟢 القسم 2: الأفعال المنفصلة</option>

            <option value="part4">🟡 القسم 4: الأفعال الشاذة والقوية</option>
            <option value="part5">🟣 القسم 5: أفعال الكيف المساعدة</option>
          </select>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">إجمالي الأفعال</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="studiedCount">0</div>
          <div class="stat-label">تمت دراستها</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="progressPercent">0%</div>
          <div class="stat-label">نسبة التقدم</div>
        </div>
      </div>
    </div>

    <div class="mini-challenge" id="miniChallenge" style="display: none;">
      <h3>🎯 تحدي سريع - اختبر معلوماتك</h3>
      <div id="challengeContent"></div>
    </div>

    <div id="verbsContainer"></div>
  </div>

    // تخزين تقدم التعلم
    let studiedVerbs = JSON.parse(localStorage.getItem('studiedVerbs_praesens')) || [];
    
    // تحديث الإحصائيات
    function updateStats() {
      document.getElementById('totalCount').innerText = allVerbs.length;
      document.getElementById('studiedCount').innerText = studiedVerbs.length;
      const percent = Math.round((studiedVerbs.length / allVerbs.length) * 100);
      document.getElementById('progressPercent').innerText = percent + '%';
    }
    
    // تسجيل دراسة فعل
    function markAsStudied(verbId) {
      if (!studiedVerbs.includes(verbId)) {
        studiedVerbs.push(verbId);
        localStorage.setItem('studiedVerbs_praesens', JSON.stringify(studiedVerbs));
        updateStats();
        filterVerbs(); // إعادة التصفية لتحديث علامة ✓
      }
    }
    
    // إعادة تعيين التقدم
    function resetProgress() {
      if (confirm('هل أنت متأكد من إعادة تعيين تقدم التعلم؟')) {
        studiedVerbs = [];
        localStorage.setItem('studiedVerbs_praesens', JSON.stringify(studiedVerbs));
        updateStats();
        filterVerbs();
        alert('✓ تم إعادة تعيين التقدم بنجاح');
      }
    }
    
    // نطق النص
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = speechRate;
        window.speechSynthesis.speak(utterance);
      }
    }
    
    // تشغيل جميع تصريفات الفعل
    function playAllExamples(verb) {
      const texts = [verb.infinitiv, ...Object.values(verb.forms)];
      let i = 0;
      function playNext() {
        if (i < texts.length) {
          speak(texts[i]);
          i++;
          setTimeout(playNext, 2000);
        }
      }
      playNext();
    }
    
    // تعيين سرعة النطق
    function setSpeechSpeed(rate) {
      speechRate = rate;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
    
    // تبديل الوضع الليلي
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const btn = document.querySelector('.dark-mode-toggle');
      btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }
    
    // فلترة الأفعال
    function filterVerbs() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filterSection = document.getElementById('filterSelect').value;
      
      const filtered = allVerbs.filter(verb => {
        const matchSearch = verb.infinitiv.toLowerCase().includes(searchTerm) || 
                           verb.arabic.toLowerCase().includes(searchTerm);
        const matchSection = filterSection === 'all' || verb.section === filterSection;
        return matchSearch && matchSection;
      });
      
      renderVerbs(filtered);
    }
    
    // عرض التحدي العشوائي
    function showRandomChallenge() {
      const randomVerb = allVerbs[Math.floor(Math.random() * allVerbs.length)];
      const wrongAnswers = allVerbs.filter(v => v.id !== randomVerb.id).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [randomVerb, ...wrongAnswers].sort(() => 0.5 - Math.random());
      
      const challengeDiv = document.getElementById('miniChallenge');
      const contentDiv = document.getElementById('challengeContent');
      
      challengeDiv.style.display = 'block';
      contentDiv.innerHTML = `
        <div class="challenge-question">❓ ما هو معنى الفعل <strong>${randomVerb.infinitiv}</strong>؟</div>
        <div class="challenge-options">
          ${options.map(opt => `<button class="challenge-option" onclick="checkAnswer('${opt.arabic}', '${randomVerb.arabic}', this)">${opt.arabic}</button>`).join('')}
        </div>
        <div class="challenge-feedback" id="challengeFeedback"></div>
      `;
      
      setTimeout(() => {
        challengeDiv.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }
    
    // التحقق من الإجابة
    function checkAnswer(selected, correct, element) {
      const feedback = document.getElementById('challengeFeedback');
      if (selected === correct) {
        feedback.innerHTML = '✅ إجابة صحيحة! أحسنت! 🎉';
        feedback.style.color = '#27ae60';
        element.style.background = '#27ae60';
      } else {
        feedback.innerHTML = `❌ إجابة خاطئة! الإجابة الصحيحة هي: "${correct}"`;
        feedback.style.color = '#e74c3c';
        element.style.background = '#e74c3c';
      }
      
      setTimeout(() => {
        document.getElementById('miniChallenge').style.display = 'none';
      }, 3000);
    }
    
    // عرض الأفعال
    function renderVerbs(verbs) {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = '';
      let currentSectionDisplay = "";
      
      verbs.forEach((verb) => {
        // إضافة عنوان القسم إذا تغير القسم الحالي
        if (verb.sectionTitle && currentSectionDisplay !== verb.section) {
          currentSectionDisplay = verb.section;
          const secHeader = document.createElement('div');
          secHeader.style.width = '100%';
          secHeader.style.textAlign = 'center';
          secHeader.style.marginTop = '40px';
          secHeader.style.marginBottom = '20px';
          secHeader.innerHTML = `
            <h2 style="color: white; background: #667eea; display: inline-block; padding: 10px 30px; border-radius: 30px;">${verb.sectionTitle}</h2>
          `;
          container.appendChild(secHeader);
        }
        
        const isStudied = studiedVerbs.includes(verb.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-section', verb.section);
        
        card.innerHTML = `
          <div class="title" onclick="markAsStudied(${verb.id});">
            <span class="infinitiv" onclick="speak('${verb.infinitiv}'); event.stopPropagation();">📖 ${verb.id}. ${verb.infinitiv} ${isStudied ? '<span class="studied-badge">✓ تمت</span>' : ''}</span>
            <button class="play-all-btn" onclick="playAllExamples(${JSON.stringify(verb).replace(/"/g, '&quot;')}); event.stopPropagation();">🔊 تشغيل الكل</button>
            <span class="arabic">${verb.arabic}</span>
          </div>
          <table>
            <thead>
              <tr><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr>
            </thead>
            <tbody>
              <tr>
                ${['ich', 'du', 'er', 'wir', 'ihr', 'sie'].map(p => `<td data-label="${p}" onclick="speak('${verb.forms[p]}'); event.stopPropagation();">${verb.forms[p]}</td>`).join('')}
              </tr>
            </tbody>
          </table>
        `;
        container.appendChild(card);
      });
    }
    
    // تهيئة الصفحة
    updateStats();
    renderVerbs(allVerbs);
  </script>
