<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>عرض المشاريع</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Tahoma, sans-serif;
    }

    body{
      background:#f4f6f9;
      color:#333;
    }

    header{
      background:#0f172a;
      color:white;
      padding:20px;
      text-align:center;
    }

    header h1{
      font-size:32px;
      margin-bottom:10px;
    }

    .projects{
      width:90%;
      min-width: 800px;
      margin:40px auto;
      display:grid;
 

    }

    .card{
      background:white;
      border-radius:15px;
      display: block;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card-content h2{
      margin-bottom:10px;
      color:#0f172a;
    }

    .card-content p{
      line-height:1.8;
      margin-bottom:15px;
    }

    .btn{
      display:inline-block;
      padding:10px 18px;
      background:#2563eb;
      color:white;
      text-decoration:none;
      border-radius:8px;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#0f172a;
      color:white;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <h1> B1 </h1>
  
  </header>

  <section class="projects">

    <div class="card">
  
      <div class="card-content">
      <h1>تصريف الأفعال الألمانية Präsens</h1>
        <p>
       100 verb
        </p>
        <a href="Project/الأفعال Präsens .html" class="btn">عرض </a>
        <a href="Project/Perfekt.html"class="btn">عرض </a>
      </div>
    </div>


    <div class="card">
  
      <div class="card-content">
      <h1> الماضي Perfekt</h1>
        <p>

•	haben / sein<br>
•	Partizip II<br>
•	تكوين الجملة

      <p>
(Modalverben) في الماضي التام.
      </p>
        </p>
        <a href="Project/Perfekt.html"class="btn">عرض </a>
      </div>
    </div>
    
  </section>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

</body>
</html>
