<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfekt Verben - نظام متطور لتعلم الأفعال الألمانية</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }

    /* الوضع الليلي */
    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
    }

    body.dark-mode .card {
      background: #2d2d44;
      color: #eee;
      border-color: #444;
    }

    body.dark-mode .title {
      background: #1a1a2e;
    }

    body.dark-mode td:hover {
      background: #3d3d5c;
    }

    body.dark-mode .search-box input,
    body.dark-mode .filter-select {
      background: #2d2d44;
      color: #eee;
      border-color: #555;
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* شريط التحكم العلوي */
    .control-bar {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    body.dark-mode .control-bar {
      background: #2d2d44;
    }

    /* أزرار التحكم */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
      background: #667eea;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .btn-danger {
      background: #e74c3c;
    }

    .btn-success {
      background: #27ae60;
    }

    .btn-warning {
      background: #f39c12;
    }

    .btn-info {
      background: #3498db;
    }

    /* مربع البحث والفلاتر */
    .search-section {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 12px 20px;
      width: 300px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .filter-select select {
      padding: 12px 20px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 16px;
      background: white;
      cursor: pointer;
    }

    /* الإحصائيات */
    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 15px 25px;
      border-radius: 15px;
      text-align: center;
      min-width: 120px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 5px;
    }

    /* بطاقة التحدي */
    .challenge-card {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .challenge-card:hover {
      transform: scale(1.02);
    }

    /* تنسيق البطاقات */
    .card {
      background: white;
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: all 0.3s;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card.highlight {
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); background: #fff8e1; }
    }

    .title {
      background: #2c3e50;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      cursor: pointer;
    }

    /* ألوان مميزة لكل قسم */
    .card[data-section="haben"] .title {
      background: #3498db;
    }

    .card[data-section="sein"] .title {
      background: #27ae60;
    }

    .card[data-section="modal"] .title {
      background: #e74c3c;
    }

    .infinitiv {
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .play-all-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .play-all-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    .arabic {
      background: #0077cc;
      padding: 5px 15px;
      border-radius: 20px;
      direction: rtl;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 12px 5px;
      background: #f8f9fa;
      color: #555;
      font-size: 14px;
    }

    body.dark-mode th {
      background: #3d3d5c;
      color: #ddd;
    }

    td {
      text-align: center;
      padding: 15px 5px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #eee;
    }

    body.dark-mode td {
      border-bottom-color: #444;
    }

    td:hover {
      background: #e3f2fd;
    }

    /* سرعة النطق */
    .speed-control {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f0f0f0;
      padding: 5px 15px;
      border-radius: 25px;
    }

    body.dark-mode .speed-control {
      background: #3d3d5c;
    }

    .speed-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: #ddd;
      transition: all 0.3s;
    }

    .speed-btn.active {
      background: #667eea;
      color: white;
    }

    /* رسالة التحدي */
    .challenge-question {
      font-size: 24px;
      margin: 15px 0;
    }

    .challenge-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .challenge-option {
      padding: 10px 20px;
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .challenge-option:hover {
      background: white;
      color: #f5576c;
    }

    .challenge-feedback {
      margin-top: 15px;
      font-size: 18px;
    }

    /* وضع التحدي المصغر */
    .mini-challenge {
      background: #f0f0f0;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    body.dark-mode .mini-challenge {
      background: #3d3d5c;
    }

    /* زر الوضع الليلي */
    .dark-mode-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 24px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s;
      z-index: 1000;
    }

    .dark-mode-toggle:hover {
      transform: scale(1.1);
    }

    /* متجاوب */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      
      th {
        display: none;
      }
      
      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
      
      td::before {
        content: attr(data-label);
        font-weight: bold;
        width: 100px;
      }
    }
    .btn-home {
  display: inline-block;
  padding: 12px 28px;
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  color: white;
  font-weight: bold;
  font-size: 16px;
  text-decoration: none;
  border-radius: 50px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(238, 90, 36, 0.3);
  border: 2px solid rgba(255,255,255,0.3);
}

.btn-home:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(238, 90, 36, 0.5);
  background: linear-gradient(135deg, #ff8c5a, #ff4757);
}
  </style>
</head>

<body>
<a href="../index.html" class="btn-home">🏠 Home 🔙</a>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

  <div class="container">
    <h1 style="text-align: center; color: white; margin-bottom: 20px;">📚 تعلم الأفعال الألمانية - Perfekt</h1>
    <p style="text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 30px;">🎯 اضغط على أي كلمة لسماع النطق | 🌟 تحدى نفسك في وضع الاختبار</p>

    <div class="control-bar">
      <div class="controls">
        
        <button class="btn" onclick="resetProgress()">🔄 إعادة تعيين التقدم</button>
        <button class="btn btn-success" onclick="showRandomChallenge()">🎯 تحدٍ عشوائي</button>
        <div class="speed-control">
          <span>⚡ سرعة النطق:</span>
          <button class="speed-btn" onclick="setSpeechSpeed(0.6)">بطيء</button>
          <button class="speed-btn active" onclick="setSpeechSpeed(0.85)">عادي</button>
          <button class="speed-btn" onclick="setSpeechSpeed(1.1)">سريع</button>
        </div>
      </div>

      <div class="search-section">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 بحث عن فعل... (بالعربية أو الألمانية)" onkeyup="filterVerbs()">
        </div>
        <div class="filter-select">
          <select id="filterSelect" onchange="filterVerbs()">
            <option value="all">📋 جميع الأقسام</option>
            <option value="haben">🔵 قسم haben (أفعال عادية)</option>
            <option value="sein">🟢 قسم sein (حركة وتغير)</option>
            <option value="modal">🔴 قسم Modalverben (أفعال الكيف)</option>
          </select>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">إجمالي الأفعال</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="studiedCount">0</div>
          <div class="stat-label">تمت دراستها</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="progressPercent">0%</div>
          <div class="stat-label">نسبة التقدم</div>
        </div>
      </div>
    </div>

    <div class="mini-challenge" id="miniChallenge" style="display: none;">
      <h3>🎯 تحدي سريع</h3>
      <div id="challengeContent"></div>
    </div>

    <div id="verbsContainer"></div>
  </div>

  <script>
    // سرعة النطق الافتراضية
    let speechRate = 0.85;
    
    // بيانات الأفعال (مثل السابق مع إضافة معرفات)
    const allVerbs = [
      // قسم haben
      { id: 1, section: "haben", infinitiv: "machen", arabic: "يفعل / يصنع", auxiliary: "haben", partizip2: "gemacht", forms: { ich: "habe Hausaufgaben gemacht", du: "hast Hausaufgaben gemacht", er: "hat Hausaufgaben gemacht", wir: "haben Hausaufgaben gemacht", ihr: "habt Hausaufgaben gemacht", sie: "haben Hausaufgaben gemacht" } },
      { id: 2, section: "haben", infinitiv: "kaufen", arabic: "يشتري", auxiliary: "haben", partizip2: "gekauft", forms: { ich: "habe ein Auto gekauft", du: "hast ein Auto gekauft", er: "hat ein Auto gekauft", wir: "haben ein Auto gekauft", ihr: "habt ein Auto gekauft", sie: "haben ein Auto gekauft" } },
      { id: 3, section: "haben", infinitiv: "essen", arabic: "يأكل", auxiliary: "haben", partizip2: "gegessen", forms: { ich: "habe Pizza gegessen", du: "hast Pizza gegessen", er: "hat Pizza gegessen", wir: "haben Pizza gegessen", ihr: "habt Pizza gegessen", sie: "haben Pizza gegessen" } },
      { id: 4, section: "haben", infinitiv: "trinken", arabic: "يشرب", auxiliary: "haben", partizip2: "getrunken", forms: { ich: "habe Wasser getrunken", du: "hast Wasser getrunken", er: "hat Wasser getrunken", wir: "haben Wasser getrunken", ihr: "habt Wasser getrunken", sie: "haben Wasser getrunken" } },
      { id: 5, section: "haben", infinitiv: "schreiben", arabic: "يكتب", auxiliary: "haben", partizip2: "geschrieben", forms: { ich: "habe einen Brief geschrieben", du: "hast einen Brief geschrieben", er: "hat einen Brief geschrieben", wir: "haben einen Brief geschrieben", ihr: "habt einen Brief geschrieben", sie: "haben einen Brief geschrieben" } },
      { id: 6, section: "haben", infinitiv: "lesen", arabic: "يقرأ", auxiliary: "haben", partizip2: "gelesen", forms: { ich: "habe ein Buch gelesen", du: "hast ein Buch gelesen", er: "hat ein Buch gelesen", wir: "haben ein Buch gelesen", ihr: "habt ein Buch gelesen", sie: "haben ein Buch gelesen" } },
      { id: 7, section: "haben", infinitiv: "hören", arabic: "يسمع", auxiliary: "haben", partizip2: "gehört", forms: { ich: "habe Musik gehört", du: "hast Musik gehört", er: "hat Musik gehört", wir: "haben Musik gehört", ihr: "habt Musik gehört", sie: "haben Musik gehört" } },
      { id: 8, section: "haben", infinitiv: "sehen", arabic: "يرى / يشاهد", auxiliary: "haben", partizip2: "gesehen", forms: { ich: "habe einen Film gesehen", du: "hast einen Film gesehen", er: "hat einen Film gesehen", wir: "haben einen Film gesehen", ihr: "habt einen Film gesehen", sie: "haben einen Film gesehen" } },
      { id: 9, section: "haben", infinitiv: "lernen", arabic: "يتعلم", auxiliary: "haben", partizip2: "gelernt", forms: { ich: "habe Deutsch gelernt", du: "hast Deutsch gelernt", er: "hat Deutsch gelernt", wir: "haben Deutsch gelernt", ihr: "habt Deutsch gelernt", sie: "haben Deutsch gelernt" } },
      { id: 10, section: "haben", infinitiv: "suchen", arabic: "يبحث عن", auxiliary: "haben", partizip2: "gesucht", forms: { ich: "habe den Schlüssel gesucht", du: "hast den Schlüssel gesucht", er: "hat den Schlüssel gesucht", wir: "haben den Schlüssel gesucht", ihr: "habt den Schlüssel gesucht", sie: "haben den Schlüssel gesucht" } },
      { id: 11, section: "haben", infinitiv: "finden", arabic: "يجد", auxiliary: "haben", partizip2: "gefunden", forms: { ich: "habe die Lösung gefunden", du: "hast die Lösung gefunden", er: "hat die Lösung gefunden", wir: "haben die Lösung gefunden", ihr: "habt die Lösung gefunden", sie: "haben die Lösung gefunden" } },
      // قسم sein
      { id: 12, section: "sein", infinitiv: "gehen", arabic: "يذهب", auxiliary: "sein", partizip2: "gegangen", forms: { ich: "bin nach Hause gegangen", du: "bist nach Hause gegangen", er: "ist nach Hause gegangen", wir: "sind nach Hause gegangen", ihr: "seid nach Hause gegangen", sie: "sind nach Hause gegangen" } },
      { id: 13, section: "sein", infinitiv: "fahren", arabic: "يسافر / يقود", auxiliary: "sein", partizip2: "gefahren", forms: { ich: "bin nach Berlin gefahren", du: "bist nach Berlin gefahren", er: "ist nach Berlin gefahren", wir: "sind nach Berlin gefahren", ihr: "seid nach Berlin gefahren", sie: "sind nach Berlin gefahren" } },
      { id: 14, section: "sein", infinitiv: "kommen", arabic: "يأتي", auxiliary: "sein", partizip2: "gekommen", forms: { ich: "bin pünktlich gekommen", du: "bist pünktlich gekommen", er: "ist pünktlich gekommen", wir: "sind pünktlich gekommen", ihr: "seid pünktlich gekommen", sie: "sind pünktlich gekommen" } },
      { id: 15, section: "sein", infinitiv: "fliegen", arabic: "يطير", auxiliary: "sein", partizip2: "geflogen", forms: { ich: "bin nach Dubai geflogen", du: "bist nach Dubai geflogen", er: "ist nach Dubai geflogen", wir: "sind nach Dubai geflogen", ihr: "seid nach Dubai geflogen", sie: "sind nach Dubai geflogen" } },
      { id: 16, section: "sein", infinitiv: "laufen", arabic: "يركض", auxiliary: "sein", partizip2: "gelaufen", forms: { ich: "bin im Park gelaufen", du: "bist im Park gelaufen", er: "ist im Park gelaufen", wir: "sind im Park gelaufen", ihr: "seid im Park gelaufen", sie: "sind im Park gelaufen" } },
      { id: 17, section: "sein", infinitiv: "bleiben", arabic: "يمكث", auxiliary: "sein", partizip2: "geblieben", forms: { ich: "bin im Hotel geblieben", du: "bist im Hotel geblieben", er: "ist im Hotel geblieben", wir: "sind im Hotel geblieben", ihr: "seid im Hotel geblieben", sie: "sind im Hotel geblieben" } },
      { id: 18, section: "sein", infinitiv: "aufstehen", arabic: "يستيقظ", auxiliary: "sein", partizip2: "aufgestanden", forms: { ich: "bin früh aufgestanden", du: "bist früh aufgestanden", er: "ist früh aufgestanden", wir: "sind früh aufgestanden", ihr: "seid früh aufgestanden", sie: "sind früh aufgestanden" } },
      { id: 19, section: "sein", infinitiv: "passieren", arabic: "يحدث", auxiliary: "sein", partizip2: "passiert", forms: { ich: "bin erschrocken", du: "bist gewachsen", er: "ist passiert", wir: "sind angekommen", ihr: "seid gelaufen", sie: "sind passiert" } },
      // قسم Modalverben
      { id: 20, section: "modal", infinitiv: "können", arabic: "يستطيع", auxiliary: "haben", partizip2: "gekonnt", forms: { ich: "habe gekonnt", du: "hast gekonnt", er: "hat gekonnt", wir: "haben gekonnt", ihr: "habt gekonnt", sie: "haben gekonnt" } },
      { id: 21, section: "modal", infinitiv: "müssen", arabic: "يجب", auxiliary: "haben", partizip2: "gemusst", forms: { ich: "habe gemusst", du: "hast gemusst", er: "hat gemusst", wir: "haben gemusst", ihr: "habt gemusst", sie: "haben gemusst" } },
      { id: 22, section: "modal", infinitiv: "wollen", arabic: "يريد", auxiliary: "haben", partizip2: "gewollt", forms: { ich: "habe gewollt", du: "hast gewollt", er: "hat gewollt", wir: "haben gewollt", ihr: "habt gewollt", sie: "haben gewollt" } },
      { id: 23, section: "modal", infinitiv: "dürfen", arabic: "يسمح له", auxiliary: "haben", partizip2: "gedurft", forms: { ich: "habe gedurft", du: "hast gedurft", er: "hat gedurft", wir: "haben gedurft", ihr: "habt gedurft", sie: "haben gedurft" } },
      { id: 24, section: "modal", infinitiv: "sollen", arabic: "ينبغي", auxiliary: "haben", partizip2: "gesollt", forms: { ich: "habe gesollt", du: "hast gesollt", er: "hat gesollt", wir: "haben gesollt", ihr: "habt gesollt", sie: "haben gesollt" } },
      { id: 25, section: "modal", infinitiv: "mögen", arabic: "يحب", auxiliary: "haben", partizip2: "gemocht", forms: { ich: "habe gemocht", du: "hast gemocht", er: "hat gemocht", wir: "haben gemocht", ihr: "habt gemocht", sie: "haben gemocht" } }
    ];

    // تخزين تقدم التعلم
    let studiedVerbs = JSON.parse(localStorage.getItem('studiedVerbs')) || [];
    
    // تحديث الإحصائيات
    function updateStats() {
      document.getElementById('totalCount').innerText = allVerbs.length;
      document.getElementById('studiedCount').innerText = studiedVerbs.length;
      const percent = Math.round((studiedVerbs.length / allVerbs.length) * 100);
      document.getElementById('progressPercent').innerText = percent + '%';
    }
    
    // تسجيل دراسة فعل
    function markAsStudied(verbId) {
      if (!studiedVerbs.includes(verbId)) {
        studiedVerbs.push(verbId);
        localStorage.setItem('studiedVerbs', JSON.stringify(studiedVerbs));
        updateStats();
      }
    }
    
    // إعادة تعيين التقدم
    function resetProgress() {
      if (confirm('هل أنت متأكد من إعادة تعيين تقدم التعلم؟')) {
        studiedVerbs = [];
        localStorage.setItem('studiedVerbs', JSON.stringify(studiedVerbs));
        updateStats();
        filterVerbs();
        alert('✓ تم إعادة تعيين التقدم بنجاح');
      }
    }
    
    // نطق النص
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = speechRate;
        window.speechSynthesis.speak(utterance);
      }
    }
    
    // تشغيل جميع أمثلة الفعل
    function playAllExamples(verb) {
      const texts = [verb.infinitiv, ...Object.values(verb.forms)];
      let i = 0;
      function playNext() {
        if (i < texts.length) {
          speak(texts[i]);
          i++;
          setTimeout(playNext, 2000);
        }
      }
      playNext();
    }
    
    // تعيين سرعة النطق
    function setSpeechSpeed(rate) {
      speechRate = rate;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
    
    // تبديل الوضع الليلي
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const btn = document.querySelector('.dark-mode-toggle');
      btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }
    
    // فلترة الأفعال
    function filterVerbs() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filterSection = document.getElementById('filterSelect').value;
      
      const filtered = allVerbs.filter(verb => {
        const matchSearch = verb.infinitiv.toLowerCase().includes(searchTerm) || 
                           verb.arabic.toLowerCase().includes(searchTerm);
        const matchSection = filterSection === 'all' || verb.section === filterSection;
        return matchSearch && matchSection;
      });
      
      renderVerbs(filtered);
    }
    
    // عرض التحدي العشوائي
    function showRandomChallenge() {
      const randomVerb = allVerbs[Math.floor(Math.random() * allVerbs.length)];
      const wrongAnswers = allVerbs.filter(v => v.id !== randomVerb.id).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [randomVerb, ...wrongAnswers].sort(() => 0.5 - Math.random());
      
      const challengeDiv = document.getElementById('miniChallenge');
      const contentDiv = document.getElementById('challengeContent');
      
      challengeDiv.style.display = 'block';
      contentDiv.innerHTML = `
        <div class="challenge-question">❓ ما هو معنى الفعل <strong>${randomVerb.infinitiv}</strong>؟</div>
        <div class="challenge-options">
          ${options.map(opt => `<div class="challenge-option" onclick="checkAnswer('${opt.arabic}', '${randomVerb.arabic}', this)">${opt.arabic}</div>`).join('')}
        </div>
        <div class="challenge-feedback" id="challengeFeedback"></div>
      `;
      
      setTimeout(() => {
        challengeDiv.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }
    
    // التحقق من الإجابة
    function checkAnswer(selected, correct, element) {
      const feedback = document.getElementById('challengeFeedback');
      if (selected === correct) {
        feedback.innerHTML = '✅ إجابة صحيحة! أحسنت! 🎉';
        feedback.style.color = '#27ae60';
        element.style.background = '#27ae60';
      } else {
        feedback.innerHTML = `❌ إجابة خاطئة! الإجابة الصحيحة هي: "${correct}"`;
        feedback.style.color = '#e74c3c';
        element.style.background = '#e74c3c';
      }
      
      setTimeout(() => {
        document.getElementById('miniChallenge').style.display = 'none';
      }, 3000);
    }
    
    // عرض الأفعال
    function renderVerbs(verbs) {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = '';
      
      verbs.forEach((verb, idx) => {
        const isStudied = studiedVerbs.includes(verb.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-section', verb.section);
        
        card.innerHTML = `
          <div class="title" onclick="markAsStudied(${verb.id}); this.parentElement.classList.add('highlight'); setTimeout(() => this.parentElement.classList.remove('highlight'), 500);">
            <span class="infinitiv" onclick="speak('${verb.infinitiv}'); event.stopPropagation();">${verb.id}. ${verb.infinitiv} ${isStudied ? '✓' : ''}</span>
      
            <span class="arabic">${verb.arabic}</span>
          </div>
          <table>
            <thead><tr><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr></thead>
            <tbody>
              <tr>
                ${['ich', 'du', 'er', 'wir', 'ihr', 'sie'].map(p => `<td data-label="${p}" onclick="speak('${verb.forms[p]}'); event.stopPropagation();">${verb.forms[p]}</td>`).join('')}
              </tr>
            </tbody>
          </table>
        `;
        container.appendChild(card);
      });
    }
    
    // تهيئة الصفحة
    updateStats();
    renderVerbs(allVerbs);
    
    // عرض تحدي عشوائي كل 30 ثانية
    let challengeInterval = setInterval(() => {
      if (Math.random() > 0.7) showRandomChallenge();
    }, 30000);
  </script>
</body>
</html>
