```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>B1.2 | منصة تعلم الألمانية التفاعلية</title>

<link rel="icon" href="images/logo.svg">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#667eea">
<meta name="description" content="منصة تفاعلية لتعلم قواعد اللغة الألمانية B1.2 مع اختبارات وتتبع تقدم">
<meta name="keywords" content="B1, تعلم الألمانية, German grammar">
<meta name="author" content="أبو نزار">

<style>

:root{
  --primary:#667eea;
  --secondary:#764ba2;
  --dark:#1e293b;
  --success:#27ae60;
  --danger:#e74c3c;
  --light:#ffffff;
  --text:#222;
  --shadow:0 10px 25px rgba(0,0,0,.1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  min-height:100vh;
  padding:20px;
  transition:.3s;
  color:var(--text);
}

body.dark{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#eee;
}

.container{
  max-width:1500px;
  margin:auto;
}

/* HEADER */

header{
  background:rgba(15,23,42,.92);
  color:#fff;
  padding:35px 20px;
  border-radius:28px;
  text-align:center;
  margin-bottom:30px;
  box-shadow:var(--shadow);
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  opacity:.9;
  font-size:18px;
}

/* STATS */

.stats{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border-radius:20px;
  padding:18px 30px;
  text-align:center;
  min-width:180px;
  box-shadow:var(--shadow);
}

body.dark .stat{
  background:#2d3748;
}

.stat-number{
  font-size:34px;
  font-weight:bold;
  color:var(--primary);
}

.stat-title{
  margin-top:8px;
  font-size:14px;
  color:#666;
}

/* SEARCH */

.search-box{
  margin-bottom:25px;
  text-align:center;
}

.search-box input{
  width:100%;
  max-width:500px;
  padding:15px 20px;
  border:none;
  border-radius:50px;
  font-size:16px;
  outline:none;
  box-shadow:var(--shadow);
}

/* PROGRESS */

.progress-section{
  background:#fff;
  border-radius:20px;
  padding:25px;
  margin-bottom:30px;
  box-shadow:var(--shadow);
}

body.dark .progress-section{
  background:#2d3748;
}

.progress-title{
  text-align:center;
  margin-bottom:15px;
  font-size:20px;
}

.progress-bar{
  background:#ddd;
  height:22px;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  background:var(--success);
  height:100%;
  width:0%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  transition:.4s;
}

/* CARDS */

.projects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

.card{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.3s;
}

body.dark .card{
  background:#2d3748;
}

.card:hover{
  transform:translateY(-6px);
}

.card-header{
  color:#fff;
  padding:22px;
  text-align:center;
}

.phase1{
  background:linear-gradient(135deg,#1a5276,#2980b9);
}

.phase2{
  background:linear-gradient(135deg,#1e8449,#27ae60);
}

.phase3{
  background:linear-gradient(135deg,#78281f,#e74c3c);
}

.phase4{
  background:linear-gradient(135deg,#6c3483,#9b59b6);
}

.card-header h2{
  font-size:25px;
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  padding:5px 14px;
  background:rgba(255,255,255,.2);
  border-radius:30px;
  font-size:13px;
}

/* DETAILS */

.details{
  padding:20px;
}

.rule{
  margin-bottom:15px;
  line-height:1.7;
}

.examples{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:15px;
}

.example{
  background:#eef2ff;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  transition:.2s;
  direction:ltr;
  font-weight:bold;
}

body.dark .example{
  background:#3b425a;
}

.example:hover{
  transform:translateX(-5px);
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  border:none;
  cursor:pointer;
  padding:12px 18px;
  border-radius:40px;
  color:#fff;
  font-weight:bold;
  transition:.3s;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.btn-study{
  background:var(--primary);
}

.btn-complete{
  background:#2c3e50;
}

.btn-complete.done{
  background:var(--success);
}

.btn:hover{
  opacity:.9;
  transform:scale(1.03);
}

/* DARK MODE */

.toggle-dark{
  position:fixed;
  bottom:20px;
  left:20px;
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:#111827;
  color:#fff;
  cursor:pointer;
  font-size:24px;
  z-index:1000;
}

/* FOOTER */

footer{
  margin-top:40px;
  text-align:center;
  color:#fff;
  opacity:.9;
}

/* RESPONSIVE */

@media(max-width:768px){

  body{
    padding:12px;
  }

  header h1{
    font-size:30px;
  }

}

</style>
</head>

<body>

<button class="toggle-dark" onclick="toggleDark()">🌙</button>

<div class="container">

<header>
  <h1>🇩🇪 منصة تعلم الألمانية B1.2</h1>
  <p>تعلم القواعد الألمانية بطريقة تفاعلية حديثة</p>
</header>

<!-- STATS -->

<div class="stats">

  <div class="stat">
    <div class="stat-number" id="totalProjects">0</div>
    <div class="stat-title">عدد الدروس</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="completedProjects">0</div>
    <div class="stat-title">مكتمل</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="percentage">0%</div>
    <div class="stat-title">نسبة الإنجاز</div>
  </div>

</div>

<!-- SEARCH -->

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 ابحث عن قاعدة..." />
</div>

<!-- PROGRESS -->

<div class="progress-section">

  <div class="progress-title">
    📊 مستوى تقدمك
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill">0%</div>
  </div>

</div>

<!-- PROJECTS -->

<div class="projects" id="projectsContainer"></div>

<footer>
  <p>© 2026 أبو نزار | منصة تعلم اللغة الألمانية</p>
</footer>

</div>

<script>

/* =========================
   البيانات
========================= */

const projects = [

{
  title:"📖 Präsens",
  phase:"phase1",
  badge:"زمن المضارع",
  link:"Project/praesens.html",

  rule:"تصريف الأفعال في الزمن الحاضر حسب الضمائر.",

  examples:[
    "Ich lerne Deutsch.",
    "Du arbeitest viel.",
    "Er spricht sehr gut."
  ]
},

{
  title:"⏰ Perfekt",
  phase:"phase1",
  badge:"الماضي التام",
  link:"Project/perfekt.html",

  rule:"haben / sein + Partizip II",

  examples:[
    "Ich habe Deutsch gelernt.",
    "Er ist nach Hause gegangen."
  ]
},

{
  title:"📚 Fälle",
  phase:"phase2",
  badge:"حالات الأسماء",
  link:"Project/faelle.html",

  rule:"Nominativ / Akkusativ / Dativ",

  examples:[
    "Ich sehe den Mann.",
    "Ich gebe dem Mann ein Buch."
  ]
},

{
  title:"🔗 Konnektoren",
  phase:"phase3",
  badge:"أدوات الربط",
  link:"Project/konnektoren.html",

  rule:"ربط الجمل باستخدام deshalb - trotzdem ...",

  examples:[
    "Es regnet, trotzdem gehe ich raus.",
    "Ich lerne Deutsch, deshalb bin ich müde."
  ]
}

];

/* =========================
   التخزين المحلي
========================= */

function getStatus(){
  return JSON.parse(localStorage.getItem("b1-status")) || {};
}

function saveStatus(data){
  localStorage.setItem("b1-status",JSON.stringify(data));
}

/* =========================
   النطق
========================= */

function speak(text){

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);

  utter.lang = "de-DE";
  utter.rate = .85;

  speechSynthesis.speak(utter);
}

/* =========================
   رسم الكروت
========================= */

function renderProjects(filter=""){

  const container = document.getElementById("projectsContainer");

  container.innerHTML = "";

  const status = getStatus();

  const filtered = projects.filter(project =>
    project.title.toLowerCase().includes(filter.toLowerCase())
  );

  filtered.forEach((project,index)=>{

    const completed = status[index];

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="card-header ${project.phase}">
        <h2>${project.title}</h2>
        <div class="badge">${project.badge}</div>
      </div>

      <div class="details">

        <div class="rule">
          ${project.rule}
        </div>

        <div class="examples">

          ${project.examples.map(ex => `
            <div class="example" onclick="speak('${ex}')">
              🔊 ${ex}
            </div>
          `).join("")}

        </div>

        <div class="buttons">

          <a class="btn btn-study" href="${project.link}">
            📘 ادرس الآن
          </a>

          <button 
            class="btn btn-complete ${completed ? 'done':''}"
            onclick="toggleComplete(${index},this)"
          >
            ${completed ? '✅ مكتمل':'🔘 غير مكتمل'}
          </button>

        </div>

      </div>

    `;

    container.appendChild(card);

  });

}

/* =========================
   التقدم
========================= */

function updateProgress(){

  const status = getStatus();

  const completed = Object.values(status).filter(Boolean).length;

  const total = projects.length;

  const percent = Math.round((completed/total)*100);

  document.getElementById("totalProjects").textContent = total;

  document.getElementById("completedProjects").textContent = completed;

  document.getElementById("percentage").textContent = percent + "%";

  const fill = document.getElementById("progressFill");

  fill.style.width = percent + "%";

  fill.textContent = percent + "%";

}

/* =========================
   إكمال الدرس
========================= */

function toggleComplete(index,btn){

  const status = getStatus();

  status[index] = !status[index];

  saveStatus(status);

  btn.classList.toggle("done");

  btn.innerHTML = status[index]
    ? "✅ مكتمل"
    : "🔘 غير مكتمل";

  updateProgress();

}

/* =========================
   الوضع الليلي
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  const btn = document.querySelector(".toggle-dark");

  btn.textContent =
    document.body.classList.contains("dark")
    ? "☀️"
    : "🌙";

}

/* =========================
   البحث
========================= */

document.getElementById("searchInput")
.addEventListener("input",e=>{

  renderProjects(e.target.value);

});

/* =========================
   تشغيل
========================= */

renderProjects();

updateProgress();

</script>

</body>
</html>
